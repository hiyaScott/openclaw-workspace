<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花园灌溉CAD设计系统 - 原型</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #1a1d23;
            --border: #2a2e38;
            --text: #e2e4e9;
            --text-muted: #8b8f99;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        
        /* 左侧画布 */
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .toolbar {
            height: 48px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        
        .toolbar button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .toolbar button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .toolbar button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .toolbar .tool-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-right: 4px;
        }
        
        .canvas-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: #0d0f12;
            cursor: crosshair;
        }
        
        /* 右侧参数面板 */
        .sidebar {
            width: 320px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 6px;
            font-size: 13px;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .zone-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .zone-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .zone-item .zone-name {
            font-weight: 500;
        }
        
        .zone-item .zone-info {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .zone-item button {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
        }
        
        .action-buttons {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        
        .status-bar {
            height: 32px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            color: var(--text-muted);
            gap: 16px;
        }
        
        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-bar .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        
        .status-bar .dot.active {
            background: var(--success);
        }
        
        /* 结果预览区域 */
        .result-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 280px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-panel.visible {
            display: block;
        }
        
        .result-panel h3 {
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .result-stat {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        
        .result-stat:last-child {
            border-bottom: none;
        }
        
        .result-stat .stat-label {
            color: var(--text-muted);
        }
        
        .result-stat .stat-value {
            font-weight: 500;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <!-- 画布区域 -->
    <div class="canvas-container">
        <div class="toolbar">
            <span class="tool-label">工具:</span>
            <button id="tool-polygon" class="active" onclick="setTool('polygon')">画区域</button>
            <button id="tool-select" onclick="setTool('select')">选择</button>
            <button id="tool-pan" onclick="setTool('pan')">平移</button>
            <div style="flex:1"></div>
            <span class="tool-label">缩放: <span id="zoom-level">100%</span></span>
            <button onclick="resetView()">重置视图</button>
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="mainCanvas"></canvas>
            <!-- 结果预览浮层 -->
            <div class="result-panel" id="resultPanel">
                <h3>📊 设计结果</h3>
                <div id="resultContent"></div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <button class="btn btn-secondary" onclick="downloadDXF()" style="flex:1;padding:8px;font-size:12px;">下载DXF</button>
                    <button class="btn btn-secondary" onclick="downloadPDF()" style="flex:1;padding:8px;font-size:12px;">下载PDF</button>
                </div>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-item">
                <span class="dot active"></span>
                <span id="status-text">就绪</span>
            </div>
            <div class="status-item">
                <span>区域: <span id="zone-count">0</span></span>
            </div>
            <div class="status-item">
                <span>鼠标: <span id="mouse-pos">0, 0</span></span>
            </div>
        </div>
    </div>
    
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>灌溉设计参数</h1>
            <p>在画布上画出绿化区域，系统自动生成方案</p>
        </div>
        
        <div class="section">
            <div class="section-title">水源配置</div>
            <div class="form-group">
                <label>水源类型</label>
                <select id="waterSource">
                    <option value="tap25">自来水 25mm (6分管)</option>
                    <option value="tap32">自来水 32mm (一寸管)</option>
                    <option value="river">河水/井水</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>流量 (m³/h)</label>
                    <input type="number" id="waterFlow" value="2.5" step="0.1">
                </div>
                <div class="form-group">
                    <label>管径 (mm)</label>
                    <input type="number" id="pipeSize" value="25" step="1">
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">窄带偏好</div>
            <div class="form-group">
                <label>宽度 &lt;1m 时的方案</label>
                <select id="narrowPref">
                    <option value="drip">💧 滴灌管</option>
                    <option value="micro_stake">🔷 地插微喷头</option>
                </select>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">当前区域设置</div>
            <div class="form-group">
                <label>植物类型</label>
                <select id="plantType">
                    <option value="lawn">🌿 草坪</option>
                    <option value="shrub">🌳 灌木带</option>
                    <option value="flower">🌸 花卉</option>
                </select>
            </div>
            <div class="form-group">
                <label>喷头位置</label>
                <select id="sprinklerLocation">
                    <option value="edge">边上 (1排)</option>
                    <option value="center">中间 (2排)</option>
                </select>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">区域列表</div>
            <div class="zone-list" id="zoneList">
                <div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">
                    暂无区域<br>使用"画区域"工具在画布上绘制
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="generateDesign()">
                🚀 生成灌溉方案
            </button>
            <button class="btn btn-secondary" onclick="toggleCoverage()">
                切换覆盖范围显示
            </button>
        </div>
    </div>
    
    <script>
    // =====================================================================
    // Canvas 交互系统
    // =====================================================================
    
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    
    let tool = 'polygon';          // 当前工具
    let zones = [];                // 所有区域
    let currentZone = null;        // 正在绘制的区域
    let isDrawing = false;         // 是否正在绘制
    let showCoverage = true;       // 是否显示覆盖范围
    let designResult = null;       // 设计结果
    
    // 视图状态
    let view = {
        scale: 10,                // 像素/米
        offsetX: 50,
        offsetY: 50
    };
    
    // 鼠标状态
    let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
    let isPanning = false;
    let panStart = { x: 0, y: 0 };
    
    function resizeCanvas() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        redraw();
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // 坐标转换
    function worldToScreen(x, y) {
        return {
            x: x * view.scale + view.offsetX,
            y: canvas.height - (y * view.scale + view.offsetY)  // Y轴翻转
        };
    }
    
    function screenToWorld(sx, sy) {
        return {
            x: (sx - view.offsetX) / view.scale,
            y: (canvas.height - sy - view.offsetY) / view.scale
        };
    }
    
    // =====================================================================
    // 绘制
    // =====================================================================
    
    function redraw() {
        // 清空
        ctx.fillStyle = '#0d0f12';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 网格
        drawGrid();
        
        // 已完成的区域
        zones.forEach((zone, idx) => {
            drawZone(zone, idx + 1, false);
        });
        
        // 正在绘制的区域
        if (currentZone) {
            drawZone(currentZone, zones.length + 1, true);
        }
        
        // 设计结果覆盖层
        if (designResult) {
            drawDesignResult();
        }
        
        // 鼠标十字
        drawCursor();
    }
    
    function drawGrid() {
        ctx.strokeStyle = '#1a1d25';
        ctx.lineWidth = 1;
        
        const step = 1 * view.scale; // 1米网格
        const startX = view.offsetX % step;
        const startY = view.offsetY % step;
        
        for (let x = startX; x < canvas.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        
        for (let y = startY; y < canvas.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
        
        // 坐标轴
        ctx.strokeStyle = '#2a2e38';
        ctx.lineWidth = 2;
        const origin = worldToScreen(0, 0);
        
        ctx.beginPath();
        ctx.moveTo(origin.x, 0);
        ctx.lineTo(origin.x, canvas.height);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(0, origin.y);
        ctx.lineTo(canvas.width, origin.y);
        ctx.stroke();
    }
    
    function drawZone(zone, id, isActive) {
        if (!zone.points || zone.points.length < 2) return;
        
        // 填充
        ctx.fillStyle = isActive ? 'rgba(59, 130, 246, 0.15)' : 'rgba(59, 130, 246, 0.08)';
        ctx.beginPath();
        const first = worldToScreen(zone.points[0].x, zone.points[0].y);
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < zone.points.length; i++) {
            const p = worldToScreen(zone.points[i].x, zone.points[i].y);
            ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fill();
        
        // 边框
        ctx.strokeStyle = isActive ? '#3b82f6' : '#5b6e8a';
        ctx.lineWidth = isActive ? 2.5 : 1.5;
        ctx.setLineDash(isActive ? [5, 5] : []);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // 顶点
        zone.points.forEach((pt, i) => {
            const sp = worldToScreen(pt.x, pt.y);
            ctx.fillStyle = isActive ? '#3b82f6' : '#5b6e8a';
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, isActive ? 5 : 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 顶点编号
            ctx.fillStyle = '#8b8f99';
            ctx.font = '11px sans-serif';
            ctx.fillText(i + 1, sp.x + 8, sp.y - 8);
        });
        
        // 区域编号标签
        const center = getPolygonCenter(zone.points);
        const sc = worldToScreen(center.x, center.y);
        ctx.fillStyle = isActive ? '#3b82f6' : '#6b7a94';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`区域${id}`, sc.x, sc.y);
        ctx.textAlign = 'left';
    }
    
    function drawDesignResult() {
        if (!designResult || !designResult.zones) return;
        
        designResult.zones.forEach(zone => {
            // 喷头
            zone.sprinklers.forEach(s => {
                const pos = worldToScreen(s.x, s.y);
                
                // 喷头本体
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // 覆盖范围
                if (showCoverage) {
                    ctx.strokeStyle = 'rgba(236, 72, 153, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, s.spray_radius * view.scale, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                // 阀门组标注
                ctx.fillStyle = '#a0a0a0';
                ctx.font = '10px sans-serif';
                ctx.fillText(`V${s.valve_group}`, pos.x + 6, pos.y - 6);
            });
            
            // 管路
            zone.pipes.forEach(p => {
                const s1 = worldToScreen(p.x1, p.y1);
                const s2 = worldToScreen(p.x2, p.y2);
                
                ctx.strokeStyle = p.pipe_type === 'main' ? '#22c55e' : '#f59e0b';
                ctx.lineWidth = p.pipe_type === 'main' ? 2.5 : 1.5;
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            });
        });
    }
    
    function drawCursor() {
        const sp = worldToScreen(mouse.worldX, mouse.worldY);
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(sp.x - 10, sp.y);
        ctx.lineTo(sp.x + 10, sp.y);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(sp.x, sp.y - 10);
        ctx.lineTo(sp.x, sp.y + 10);
        ctx.stroke();
    }
    
    function getPolygonCenter(points) {
        let x = 0, y = 0;
        points.forEach(p => { x += p.x; y += p.y; });
        return { x: x / points.length, y: y / points.length };
    }
    
    // =====================================================================
    // 交互事件
    // =====================================================================
    
    canvas.addEventListener('mousedown', e => {
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const world = screenToWorld(sx, sy);
        
        if (tool === 'pan' || (tool === 'polygon' && e.button === 1)) {
            isPanning = true;
            panStart = { x: e.clientX, y: e.clientY };
            canvas.style.cursor = 'grabbing';
            return;
        }
        
        if (tool === 'polygon') {
            if (!isDrawing) {
                // 开始新区域
                isDrawing = true;
                currentZone = {
                    points: [{ x: world.x, y: world.y }],
                    plantType: document.getElementById('plantType').value,
                    location: document.getElementById('sprinklerLocation').value
                };
            } else {
                // 添加点
                // 检查是否点击了第一个点（闭合）
                const first = currentZone.points[0];
                const dist = Math.sqrt(
                    Math.pow(world.x - first.x, 2) + 
                    Math.pow(world.y - first.y, 2)
                );
                
                if (dist < 0.5 / view.scale && currentZone.points.length >= 3) {
                    // 闭合多边形
                    finishZone();
                } else {
                    currentZone.points.push({ x: world.x, y: world.y });
                }
            }
            redraw();
        }
    });
    
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const world = screenToWorld(sx, sy);
        
        mouse.x = sx;
        mouse.y = sy;
        mouse.worldX = world.x;
        mouse.worldY = world.y;
        
        document.getElementById('mouse-pos').textContent = 
            `${world.x.toFixed(1)}, ${world.y.toFixed(1)}`;
        
        if (isPanning) {
            const dx = e.clientX - panStart.x;
            const dy = e.clientY - panStart.y;
            view.offsetX += dx;
            view.offsetY -= dy; // Y翻转
            panStart = { x: e.clientX, y: e.clientY };
            redraw();
        }
        
        redraw();
    });
    
    canvas.addEventListener('mouseup', () => {
        isPanning = false;
        canvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    });
    
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        const newScale = view.scale * zoomFactor;
        
        if (newScale >= 2 && newScale <= 100) {
            view.scale = newScale;
            document.getElementById('zoom-level').textContent = 
                Math.round(view.scale * 10) + '%';
            redraw();
        }
    });
    
    canvas.addEventListener('dblclick', e => {
        if (tool === 'polygon' && isDrawing) {
            finishZone();
        }
    });
    
    // 键盘事件
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isDrawing) {
            cancelDrawing();
        }
        if (e.key === 'Enter' && isDrawing && currentZone.points.length >= 3) {
            finishZone();
        }
    });
    
    // =====================================================================
    // 工具函数
    // =====================================================================
    
    function setTool(t) {
        tool = t;
        document.querySelectorAll('.toolbar button').forEach(b => {
            if (b.id && b.id.startsWith('tool-')) {
                b.classList.toggle('active', b.id === `tool-${t}`);
            }
        });
        canvas.style.cursor = t === 'pan' ? 'grab' : 'crosshair';
    }
    
    function finishZone() {
        if (!currentZone || currentZone.points.length < 3) return;
        
        zones.push({...currentZone});
        currentZone = null;
        isDrawing = false;
        
        updateZoneList();
        updateStatus();
        redraw();
    }
    
    function cancelDrawing() {
        currentZone = null;
        isDrawing = false;
        redraw();
    }
    
    function clearAll() {
        zones = [];
        currentZone = null;
        isDrawing = false;
        designResult = null;
        document.getElementById('resultPanel').classList.remove('visible');
        updateZoneList();
        updateStatus();
        redraw();
    }
    
    function resetView() {
        view.scale = 10;
        view.offsetX = 50;
        view.offsetY = 50;
        document.getElementById('zoom-level').textContent = '100%';
        redraw();
    }
    
    function deleteZone(idx) {
        zones.splice(idx, 1);
        updateZoneList();
        updateStatus();
        redraw();
    }

                plant_type: zone.plantType,
                location: zone.location
            })),
            water_source_flow: waterFlow,
            pipe_size: pipeSize,
            narrow_preference: narrowPref,

        };
        
        try {
            // 模拟API调用（实际部署时替换为真实后端地址）
            // const response = await fetch('/api/design', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(request)
            // });
            // designResult = await response.json();
            
            // 临时：模拟结果用于前端演示
            designResult = simulateDesignResult(request);

        } catch (err) {

    }
    
    function simulateDesignResult(request) {
        // 前端模拟：生成简单的喷头位置（实际应由后端计算）
        const result = { zones: [], valve_groups: [], total_valves: 0, total_flow: 0, max_group_flow: 0 };
        
        request.zones.forEach(zone => {
            // 简化的六边形密铺算法
            const bbox = getBBox(zone.boundary);
            const sprinklers = [];
            const spacing = 3.0; // 简化
            
            for (let x = bbox.minX + spacing/2; x < bbox.maxX; x += spacing) {
                for (let y = bbox.minY + spacing/2; y < bbox.maxY; y += spacing) {
                    if (pointInPolygon(x, y, zone.boundary)) {
                        sprinklers.push({
                            x, y,
                            type: 'fan78004',
                            valve_group: 1,
                            spray_radius: 4.0
                        });
                    }
                }
            }
            
            // 简化的管路：连接所有喷头
            const pipes = [];
            for (let i = 0; i < sprinklers.length - 1; i++) {
                pipes.push({
                    x1: sprinklers[i].x, y1: sprinklers[i].y,
                    x2: sprinklers[i+1].x, y2: sprinklers[i+1].y,
                    pipe_type: i === 0 ? 'main' : 'branch',
                    diameter: 25,
                    length: Math.sqrt(
                        Math.pow(sprinklers[i+1].x - sprinklers[i].x, 2) +
                        Math.pow(sprinklers[i+1].y - sprinklers[i].y, 2)
                    )
                });
            }
            
            result.zones.push({
                zone_id: zone.zone_id,
                plant_type: zone.plant_type,
                sprinkler_count: sprinklers.length,
                valve_count: 1,
                total_flow: sprinklers.length * 0.5,
                sprinklers,
                pipes
            });
        });
        
        result.total_valves = result.zones.length;
        result.total_flow = result.zones.reduce((s, z) => s + z.total_flow, 0);
        result.max_group_flow = Math.max(...result.zones.map(z => z.total_flow));
        
        return result;
    }
    
    function getBBox(points) {
        const xs = points.map(p => p.x);
        const ys = points.map(p => p.y);
        return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
    }
    
    function pointInPolygon(x, y, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            const xi = polygon[i].x, yi = polygon[i].y;
            const xj = polygon[j].x, yj = polygon[j].y;
            if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 1e-10) + xi)) {
                inside = !inside;
            }
        }
        return inside;
    }
    
    function displayResult(result) {
        const panel = document.getElementById('resultPanel');
        const content = document.getElementById('resultContent');
        
        const totalSprinklers = result.zones.reduce((s, z) => s + z.sprinkler_count, 0);
        const totalPipeLength = result.zones.reduce((s, z) => 
            s + z.pipes.reduce((ps, p) => ps + p.length, 0), 0);
        
        content.innerHTML = `
            <div class="result-stat">
                <span class="stat-label">区域数量</span>
                <span class="stat-value">${result.zones.length} 个</span>
            </div>
            <div class="result-stat">
                <span class="stat-label">喷头总数</span>
                <span class="stat-value">${totalSprinklers} 个</span>
            </div>
            <div class="result-stat">
                <span class="stat-label">阀门数量</span>
                <span class="stat-value">${result.total_valves} 个</span>
            </div>
            <div class="result-stat">
                <span class="stat-label">总流量</span>
                <span class="stat-value">${result.total_flow.toFixed(1)} m³/h</span>
            </div>
            <div class="result-stat">
                <span class="stat-label">管路总长</span>
                <span class="stat-value">${totalPipeLength.toFixed(1)} m</span>
            </div>
        `;
        
        panel.classList.add('visible');
    }
