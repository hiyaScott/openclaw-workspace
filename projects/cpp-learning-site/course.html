<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程详情 - C++ 核心课程</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="course-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="back-link">← 返回课程列表</a>
    </div>
    <div class="nav-title" id="navTitle">课程详情</div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
  </nav>

  <!-- 课程主体 -->
  <main class="course-main">
    <!-- 左侧：PDF（主体） -->
    <section class="pdf-section">
      <div class="pdf-header">
        <h3>📄 课程资料</h3>
        <a id="pdfDownload" href="" download class="download-btn">下载 PDF</a>
      </div>
      <div class="pdf-viewer">
        <iframe id="pdfFrame" src="" frameborder="0"></iframe>
      </div>
    </section>

    <!-- 右侧：课程信息 + 视频链接 -->
    <aside class="course-sidebar">
      <div class="sidebar-content">
        <h1 id="courseTitle">课程标题</h1>
        
        <div class="course-meta">
          <span class="level-badge" id="courseLevel">入门</span>
          <span class="duration" id="courseDuration">--</span>
        </div>

        <p class="course-desc" id="courseDesc">课程描述</p>

        <div class="tags" id="courseTags"></div>

        <!-- 腾讯会议视频链接（如有） -->
        <div class="video-card tencent-card" id="tencentCard" style="display:none">
          <div class="video-card-icon" style="background:#0066FF">🎥</div>
          <div class="video-card-info">
            <div class="video-card-label">腾讯会议录制</div>
            <div class="video-card-note" id="tencentCardNote"></div>
          </div>
          <a id="tencentLink" href="" target="_blank" rel="noopener" class="video-card-btn" style="background:#0066FF">
            观看
          </a>
        </div>

        <!-- 腾讯会议资源标签 -->
        <div class="resource-tags" id="resourceTags" style="display:none">
          <span class="resource-tag tag-notes">📝 纪要</span>
          <span class="resource-tag tag-timeline">⏱ 时间轴</span>
          <span class="resource-tag tag-transcript">📄 逐字稿</span>
        </div>

        <!-- 课程纪要 -->
        <div class="meeting-notes" id="meetingNotes" style="display:none">
          <div class="notes-toggle" id="notesToggle">
            <span class="notes-icon">📝</span>
            <span class="notes-label">课程纪要</span>
            <span class="notes-arrow">▼</span>
          </div>
          <div class="notes-content" id="notesContent" style="display:none">
            <div class="notes-source" id="notesSource"></div>
            <div class="notes-summary" id="notesSummary"></div>
            <div class="notes-sections" id="notesSections"></div>
          </div>
        </div>
        <!-- ClassIn 配套视频 -->
        <div class="video-card" id="videoCard">
          <div class="video-card-icon">▶</div>
          <div class="video-card-info">
            <div class="video-card-label">配套视频</div>
            <div class="video-card-note" id="videoCardNote"></div>
          </div>
          <a id="videoLink" href="" target="_blank" rel="noopener" class="video-card-btn">
            观看
          </a>
        </div>

        <!-- 学习状态 -->
        <div class="progress-section" id="progressSection">
          <div class="progress-header">
            <span class="progress-icon">📍</span>
            <span class="progress-title">学习状态</span>
          </div>
          <div class="progress-status" id="progressStatus">未开始</div>
          <button class="progress-btn" id="progressBtn" onclick="toggleProgress()">标记为已完成</button>
        </div>

        <!-- 练习题 -->
        <div class="exercises-section" id="exercisesSection" style="display:none">
          <div class="exercises-header">
            <span class="exercises-icon">🎯</span>
            <span class="exercises-title">洛谷练习题</span>
          </div>
          <div class="exercises-groups" id="exercisesGroups">
            <!-- 由 JS 渲染 -->
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- 课程切换 -->
  <nav class="lesson-nav" id="lessonNav">
    <!-- 上下课导航由 JS 渲染 -->
  </nav>

  <!-- 二次确认对话框 -->
  <div class="confirm-dialog" id="confirmDialog" style="display:none">
    <div class="confirm-dialog-overlay" onclick="closeConfirmDialog()"></div>
    <div class="confirm-dialog-box">
      <div class="confirm-dialog-title" id="confirmDialogTitle">确认操作</div>
      <div class="confirm-dialog-message" id="confirmDialogMessage"></div>
      <div class="confirm-dialog-actions">
        <button class="confirm-dialog-btn confirm-dialog-cancel" onclick="closeConfirmDialog()">取消</button>
        <button class="confirm-dialog-btn confirm-dialog-confirm" id="confirmDialogConfirmBtn">确认</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
